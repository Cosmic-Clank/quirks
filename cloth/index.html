<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloth</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1117; }
    /* touch-action: none lets a finger pull the cloth instead of scrolling the page */
    canvas { display: block; touch-action: none; cursor: grab; }

    /* ---- Control bar, floating at the bottom ---- */
    .bar {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      max-width: 560px;
      margin: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px 12px;
      padding: 10px 12px;
      font: 13px monospace;
      color: #ddd;
      background: rgba(14, 17, 23, 0.85);
      border: 1px solid #444;
      border-radius: 6px;
    }
    .tip { width: 100%; margin: 0; text-align: center; color: #888; }
    button {
      padding: 6px 12px;
      font: inherit;
      color: inherit;
      background: #0e1117;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { border-color: #888; }
    /* The tool you're using */
    button[aria-pressed="true"] { color: #0e1117; background: #7cc4f0; border-color: #7cc4f0; }
    label { display: flex; align-items: center; gap: 8px; }
    input { width: 80px; margin: 0; accent-color: #7cc4f0; }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>

  <div class="bar">
    <p class="tip">Drag the cloth to pull it. Switch to Cut and swipe through it.</p>
    <button type="button" data-tool="pull" aria-pressed="true">Pull</button>
    <button type="button" data-tool="cut" aria-pressed="false">Cut</button>
    <label>Gravity <input type="range" id="gravity" min="0" max="1" step="0.05" value="0.3"></label>
    <label>Wind <input type="range" id="wind" min="0" max="0.5" step="0.05" value="0"></label>
    <button type="button" id="reset">Reset</button>
  </div>

  <script src="cloth.js"></script>
</body>
</html>
