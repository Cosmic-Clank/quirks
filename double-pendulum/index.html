<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Double Pendulum</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1117; }
    canvas { display: block; }

    /* ---- Settings panel ---- */
    .panel {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 230px;
      padding: 6px 12px 12px;
      font: 13px monospace;
      color: #ddd;
      background: rgba(14, 17, 23, 0.85);
      border: 1px solid #444;
      border-radius: 6px;
    }
    .panel summary { padding: 4px 0; cursor: pointer; }
    .panel p { margin: 8px 0 0; color: #888; line-height: 1.5; }
    /* Name and number on one line, slider underneath */
    .panel label { display: grid; grid-template-columns: 1fr auto; margin-top: 12px; }
    .panel input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 4px 0 0; }
    .panel .check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
    .panel input { margin: 0; accent-color: #c792ea; }
    .panel button {
      margin-top: 12px;
      padding: 6px 12px;
      font: inherit;
      color: inherit;
      background: #0e1117;
      border: 1px solid #444;
      border-radius: 6px;
      cursor: pointer;
    }
    .panel button:hover { border-color: #888; }

    /* Phones: stretch the panel along the bottom, where a thumb can reach it */
    @media (max-width: 500px) {
      .panel { top: auto; bottom: 12px; left: 12px; width: auto; }
    }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>

  <details class="panel" id="panel" open>
    <summary>Settings</summary>
    <label>Pendulums <output id="count-value"></output>
      <input type="range" id="count" min="1" max="50" value="8">
    </label>

    <!-- Starting angles: 0° hangs straight down, 180° points straight up -->
    <label>Top arm <output id="top-angle-value"></output>
      <input type="range" id="top-angle" min="0" max="180" value="150">
    </label>
    <label>Bottom arm <output id="bottom-angle-value"></output>
      <input type="range" id="bottom-angle" min="0" max="180" value="165">
    </label>

    <!-- Each notch makes the gap between pendulums 10 times smaller -->
    <label>Offset <output id="offset-value"></output>
      <input type="range" id="offset" min="-4" max="0" step="1" value="-1">
    </label>
    <p>How far apart each pendulum starts from the next.</p>

    <label class="check"><input type="checkbox" id="trails" checked> Trails</label>
    <button type="button" id="restart">Restart</button>
    <button type="button" id="random">Random</button>
  </details>

  <script src="pendulum.js"></script>
</body>
</html>
