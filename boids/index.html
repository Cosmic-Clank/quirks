<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boids</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1117; }
    /* touch-action: none stops a finger drag from scrolling the page, so it pushes the flock instead */
    canvas { display: block; touch-action: none; }
    .home-link {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 6px 12px;
      font: 14px monospace;
      color: #ddd;
      text-decoration: none;
      background: #0e1117;
      border: 1px solid #444;
      border-radius: 6px;
    }
    .home-link:hover { border-color: #888; }
  </style>
</head>
<body>
  <canvas id="sky"></canvas>
  <a class="home-link" href="../">← quirks</a>
  <script src="boids.js"></script>
</body>
</html>
