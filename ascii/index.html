<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASCII Video</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="controls">
    <a class="button home-link" href="../">← quirks</a>
    <label class="button">
      Choose video
      <input type="file" id="file-input" accept="video/*" hidden>
    </label>
    <button type="button" id="camera-button" class="button">Use camera</button>
    <button type="button" id="pause-button" class="button" disabled>Pause</button>
    <label class="slider">
      Width
      <input type="range" id="width-slider" min="40" max="240" step="10" value="120">
      <span id="width-value">120</span>
    </label>
    <label class="toggle">
      <input type="checkbox" id="color-toggle">
      Color
    </label>
    <span id="message" role="status"></span>
  </header>

  <main>
    <!-- The real video plays here, but we keep it hidden. It's just our frame source. -->
    <video id="video" playsinline loop hidden></video>

    <!-- Tiny canvas we draw each frame onto, then read the pixels back from. Never shown. -->
    <canvas id="canvas" hidden></canvas>

    <!-- The big visible canvas we draw the ASCII characters onto. -->
    <canvas id="display"></canvas>
  </main>

  <script src="main.js"></script>
</body>
</html>
